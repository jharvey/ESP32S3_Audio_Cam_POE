; Classroom intercom firmware, ESP32-S3R8 + 16 MB W25Q128 flash.
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x) for polled W5500 Ethernet, PDM RX in ESP_I2S and
; ESP-SR. PlatformIO's own espressif32 platform stops at Arduino 2.0.x, so this uses the
; community pioarduino platform. The first build downloads ~1.5 GB of toolchain and framework.

[platformio]
default_envs = intercom
src_dir = src
; Machine-specific settings (where the toolchain lives) go in local-*.ini next to this file.
; Those files aren't committed; see local-windows.ini.example for this PC's NAS setup.
; On Linux nothing extra is needed: PlatformIO keeps everything in ~/.platformio.
extra_configs = local-*.ini

[env:intercom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi      ; octal PSRAM (S3R8)
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1                 ; console on native USB (GPIO19/20)
    -DARDUINO_USB_MODE=1
    -Isrc/core
build_unflags = -std=gnu++11
build_src_filter = +<*> -<../sim/>
