; Classroom intercom firmware, ESP32-S3R8 + 16 MB W25Q128 flash.
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x) for polled W5500 Ethernet, PDM RX in ESP_I2S and
; ESP-SR. PlatformIO's own espressif32 platform stops at Arduino 2.0.x, so this uses the
; community pioarduino platform. The first build downloads ~1.5 GB of toolchain and
; framework into core_dir below (on the NAS).

[platformio]
default_envs = intercom
src_dir = src
; Toolchain and framework live on the NAS (M:), not C:. Build output stays local (.pio) for speed.
; Kept short: Espressif's library paths are close to Windows' 260-character limit.
core_dir = M:/pio
; Windows won't run programs from the NAS share ("Access is denied"), so the compiler is
; a local copy linked in below (C:/pio-tc, ~0.5 GB). See firmware/README.md "Firmware build".

[env:intercom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
platform_packages =
    toolchain-xtensa-esp-elf @ symlink://C:/pio-tc/toolchain-xtensa-esp-elf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi      ; octal PSRAM (S3R8)
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1                 ; console on native USB (GPIO19/20)
    -DARDUINO_USB_MODE=1
    -Isrc/core
build_unflags = -std=gnu++11
build_src_filter = +<*> -<../sim/>
